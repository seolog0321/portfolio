<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>管理画面</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #000;
  --surface: #161616;
  --surface-2: #222;
  --line: #2b2b2b;
  --text: #f2f2f2;
  --muted: #8f8f8f;
  --danger: #ff6b6b;
  --radius: 6px;
  --gap: clamp(12px, 2vw, 24px);
  --pad: clamp(16px, 4vw, 48px);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic",
          "Noto Sans JP", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
html.scroll-lock { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.7; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); z-index: 10; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- Gallery ---------- */
.site-header { padding: clamp(40px, 9vw, 112px) var(--pad) clamp(24px, 4vw, 48px); max-width: 1600px; margin: 0 auto; }
.site-title { margin: 0; font-size: clamp(2rem, 7vw, 5.5rem); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.site-lead { margin: 1.2em 0 0; max-width: 38em; color: var(--muted); font-size: clamp(.9rem, 1.6vw, 1.05rem); white-space: pre-line; }

.filter-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.filter-inner { max-width: 1600px; margin: 0 auto; padding: 12px var(--pad); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-inner::-webkit-scrollbar { display: none; }
.chip { flex: none; appearance: none; cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: .875rem; color: var(--muted); transition: color .2s, border-color .2s, background .2s; }
.chip:hover { color: var(--text); border-color: #555; }
.chip[aria-pressed="true"] { background: var(--text); color: #000; border-color: var(--text); }
.chip .count { margin-left: .45em; opacity: .6; font-variant-numeric: tabular-nums; }

main { max-width: 1600px; margin: 0 auto; padding: var(--gap) var(--pad) 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: calc(var(--gap) * 1.4) var(--gap); margin: 0; padding: 0; list-style: none; }
.card { margin: 0; }
.card[hidden] { display: none; }
.card-btn { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--radius); background: var(--surface); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.play-badge { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; }
.play-badge::before { content: ""; margin-left: 2px; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.card-title { margin: 12px 0 0; font-size: 1rem; font-weight: 500; line-height: 1.4; }
.card-meta { margin: 2px 0 0; font-size: .8125rem; color: var(--muted); }
@media (hover: hover) {
  .card-btn:hover .thumb img { transform: scale(1.04); }
  .grid:hover .card { opacity: .42; transition: opacity .3s; }
  .grid:hover .card:hover, .grid:hover .card:focus-within { opacity: 1; }
}
.empty { color: var(--muted); padding: 64px 0; text-align: center; }

.site-footer { max-width: 1600px; margin: 0 auto; padding: 32px var(--pad) 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
.site-footer a { text-decoration: none; border-bottom: 1px solid var(--line); }
.site-footer a:hover { color: var(--text); }

.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--text); color: #000; text-decoration: none; font-size: .875rem; padding: 8px 18px; border-radius: 999px; }

/* ---------- Modal ---------- */
dialog.modal { width: min(1040px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); overflow: hidden; }
dialog.modal::backdrop { background: rgba(0,0,0,.82); }
dialog.modal[open] { animation: modal-in .28s cubic-bezier(.2,.7,.2,1); }
@keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-scroll { max-height: calc(100dvh - 34px); overflow-y: auto; overscroll-behavior: contain; }
.modal-media { background: #000; aspect-ratio: 16 / 9; }
.modal-media iframe, .modal-media video, .modal-media img { width: 100%; height: 100%; display: block; border: 0; object-fit: contain; background: #000; }
.media-placeholder { position: relative; width: 100%; height: 100%; }
.media-placeholder img { object-fit: cover; }
.ext-link { padding: 10px clamp(20px,4vw,36px) 0; font-size: .875rem; color: var(--muted); }
.modal-body { padding: clamp(20px,4vw,36px); display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 28px clamp(24px,5vw,64px); }
.modal-title { margin: 0; font-size: clamp(1.35rem,3vw,2rem); line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
.modal-desc { margin: 14px 0 0; color: #cfcfcf; max-width: 38em; white-space: pre-line; }
.modal-side h3 { margin: 0 0 8px; font-size: .8125rem; font-weight: 500; color: var(--muted); }
.modal-side section + section { margin-top: 22px; }
.modal-side dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: .9rem; }
.modal-side dt { color: var(--muted); }
.modal-side dd { margin: 0; }
.tool-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tool-list li { padding: 3px 12px; border: 1px solid #3a3a3a; border-radius: 999px; font-size: .8125rem; }
.link-list { margin: 0; padding: 0; list-style: none; font-size: .9rem; }
.link-list a { text-decoration: none; border-bottom: 1px solid #555; }
.link-list a:hover { border-color: var(--text); }
.modal-nav { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(20px,4vw,36px); border-top: 1px solid var(--line); }
.nav-btn { appearance: none; cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: .875rem; color: var(--muted); transition: color .2s, border-color .2s; }
.nav-btn:hover { color: var(--text); border-color: #555; }
.nav-btn[disabled] { opacity: .3; cursor: default; }
.close-btn { position: absolute; top: 12px; right: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.close-btn::before, .close-btn::after { content: ""; position: absolute; left: 12px; top: 19px; width: 16px; height: 1.5px; background: #fff; }
.close-btn::before { transform: rotate(45deg); }
.close-btn::after { transform: rotate(-45deg); }

/* ---------- Admin ---------- */
.admin { max-width: 960px; margin: 0 auto; padding: 32px var(--pad) 96px; }
.admin h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
.admin h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.admin-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; cursor: pointer; display: inline-block; text-decoration: none; background: transparent; border: 1px solid #444; border-radius: 999px; padding: 8px 18px; font-size: .9rem; color: var(--text); }
.btn:hover { border-color: #888; }
.btn.primary { background: var(--text); color: #000; border-color: var(--text); }
.btn.danger { color: var(--danger); border-color: #5a2a2a; }
.btn.small { padding: 4px 12px; font-size: .8125rem; }
.btn[disabled] { opacity: .35; cursor: default; }
.status { min-height: 1.7em; margin: 12px 0 0; color: var(--muted); font-size: .9rem; }
.status.err { color: var(--danger); }
.banner { margin: 16px 0 0; padding: 12px 16px; border: 1px solid #444; border-radius: var(--radius); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: .9rem; }
.panel { margin-top: 28px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: .8125rem; color: var(--muted); margin-bottom: 4px; }
.field small { display: block; color: var(--muted); font-size: .75rem; margin-top: 4px; }
.field input[type="text"], .field input[type="email"], .field input[type="number"], .field textarea, .field select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); font-size: 16px; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: .875rem; cursor: pointer; }
.wlist { list-style: none; margin: 0; padding: 0; }
.wrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow img { width: 96px; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; display: block; background: var(--bg); }
.wrow .t { font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.wrow .m { font-size: .8125rem; color: var(--muted); }
.wrow .ops { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.preview { width: 240px; max-width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: var(--radius); display: block; margin: 6px 0 8px; background: var(--bg); }
.hint { color: var(--muted); font-size: .8125rem; margin-top: 24px; }

@media (max-width: 720px) {
  dialog.modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
  .modal-scroll { max-height: 100dvh; height: 100dvh; }
  .modal-body { grid-template-columns: 1fr; }
  .chip { padding: 8px 16px; }
  .two { grid-template-columns: 1fr; }
  .wrow { grid-template-columns: 72px 1fr; }
  .wrow img { width: 72px; }
  .wrow .ops { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:48px">この画面にはJavaScriptが必要です。</p></noscript>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
var safeUrl = function (u) { return /^https?:\/\//i.test(u || '') ? u : ''; };
var root = $('#root');

var LS = 'pf-admin-cfg';
var cfg = { owner: '', repo: '', branch: 'main', token: '' };
var remote = { sha: null };
var draft = null, dirty = false, saving = false;
var pending = {};      // 保存待ちのファイル path -> Blob
var previews = {};     // path -> objectURL（プレビュー用）
var editing = null, buf = null, formErr = '', busy = '', delArmed = -1;
var status = '', statusErr = false, view = '';

/* ---------- 設定の保存・自動入力 ---------- */
function loadCfg() {
  try { var s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) cfg = Object.assign(cfg, s); } catch (e) {}
  if (!cfg.owner && /\.github\.io$/.test(location.hostname)) {
    cfg.owner = location.hostname.split('.')[0];
    var seg = location.pathname.split('/')[1] || '';
    cfg.repo = (!seg || /\.html?$/.test(seg)) ? cfg.owner + '.github.io' : seg;
  }
}
function saveCfg(remember) {
  try { if (remember) localStorage.setItem(LS, JSON.stringify(cfg)); else localStorage.removeItem(LS); } catch (e) {}
}
function siteUrl() { return location.href.replace(/admin\.html.*$/, ''); }

/* ---------- GitHub API ---------- */
async function gh(method, path, body) {
  var r = await fetch('https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + path, {
    method: method, cache: 'no-store',
    headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { var err = new Error((j && j.message) || r.statusText); err.status = r.status; throw err; }
  return j;
}
function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
function toB64(str) { var bytes = new TextEncoder().encode(str), bin = ''; bytes.forEach(function (b) { bin += String.fromCharCode(b); }); return btoa(bin); }
function fromB64(b) { var bin = atob(b.replace(/\n/g, '')), bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }); return new TextDecoder().decode(bytes); }
function blobToB64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); }); }

function errText(e) {
  var s = e && e.status;
  if (s === 401) return 'トークンが正しくないか、期限が切れています。トークンを作り直してください。';
  if (s === 403) return 'このトークンには書き込みの権限がありません。Contents が「Read and write」になっているか確認してください。';
  if (s === 404) return 'リポジトリが見つからないか、トークンがそのリポジトリを許可していません。ユーザー名・リポジトリ名・トークンの対象を確認してください。';
  if (s === 409 || s === 422) return '別の場所で先に更新されたようです。「最新を読み込み直す」を押してからやり直してください。';
  if (e && e.name === 'TypeError') return 'GitHubに接続できません。ネットワークを確認してください。';
  return '処理できませんでした。少し待ってからもう一度お試しください。';
}

async function putFile(path, b64, message) {
  try { return await gh('PUT', '/contents/' + encPath(path), { message: message, content: b64, branch: cfg.branch }); }
  catch (e) {
    if (e.status !== 422 && e.status !== 409) throw e;
    var cur = await gh('GET', '/contents/' + encPath(path) + '?ref=' + encodeURIComponent(cfg.branch));
    return gh('PUT', '/contents/' + encPath(path), { message: message, content: b64, branch: cfg.branch, sha: cur.sha });
  }
}

async function loadRemote() {
  try {
    var j = await gh('GET', '/contents/works.json?ref=' + encodeURIComponent(cfg.branch));
    remote.sha = j.sha;
    draft = JSON.parse(fromB64(j.content));
  } catch (e) {
    if (e.status === 404 && /works\.json|Not Found/.test(e.message)) {
      // リポジトリは見えるが works.json がない場合
      try { await gh('GET', ''); remote.sha = null; draft = { site: { name: '', lead: '', email: '' }, works: [] }; }
      catch (e2) { throw e2; }
    } else throw e;
  }
  if (!draft.site) draft.site = { name: '', lead: '', email: '' };
  if (!Array.isArray(draft.works)) draft.works = [];
  dirty = false;
}

/* ---------- 画面 ---------- */
function showSetup(msg) {
  view = 'setup';
  root.innerHTML = '<div class="admin"><h1>管理画面</h1><p class="status' + (msg ? ' err' : '') + '" id="a-status">' + esc(msg || 'GitHubに接続します。最初の1回だけ入力してください。') + '</p>' +
    '<section class="panel">' +
    '<div class="two"><label class="field"><span>GitHubのユーザー名</span><input type="text" id="c-owner" value="' + esc(cfg.owner) + '" autocomplete="off"></label>' +
    '<label class="field"><span>リポジトリ名</span><input type="text" id="c-repo" value="' + esc(cfg.repo || 'portfolio') + '" autocomplete="off"></label></div>' +
    '<label class="field"><span>ブランチ名</span><input type="text" id="c-branch" value="' + esc(cfg.branch || 'main') + '" autocomplete="off"><small>わからなければ main のままで大丈夫です。</small></label>' +
    '<label class="field"><span>アクセストークン</span><input type="password" id="c-token" value="' + esc(cfg.token) + '" autocomplete="off"><small>このリポジトリの Contents に書き込める、期限つきのトークンを貼ります。他の人には見せないでください。</small></label>' +
    '<label class="field"><span><input type="checkbox" id="c-remember" checked> この端末のブラウザに保存する（共用のパソコンではチェックを外してください）</span></label>' +
    '<p><button class="btn primary" data-act="connect">接続する</button></p></section></div>';
}

async function connect() {
  var g = function (id) { return document.getElementById(id); };
  cfg.owner = g('c-owner').value.trim(); cfg.repo = g('c-repo').value.trim();
  cfg.branch = g('c-branch').value.trim() || 'main'; cfg.token = g('c-token').value.trim();
  if (!cfg.owner || !cfg.repo || !cfg.token) { showSetup('ユーザー名・リポジトリ名・トークンを入力してください。'); return; }
  var remember = g('c-remember').checked;
  view = 'loading'; root.innerHTML = '<div class="admin"><p class="status">GitHubから読み込んでいます…</p></div>';
  try { await loadRemote(); saveCfg(remember); showMain(); }
  catch (e) { showSetup(errText(e)); }
}

function logout() { cfg.token = ''; saveCfg(false); draft = null; dirty = false; showSetup('トークンを削除しました。'); }

function setStatus(msg, err) { status = msg; statusErr = !!err; var el = $('#a-status'); if (el) { el.textContent = msg; el.className = 'status' + (err ? ' err' : ''); } }
function src(p) { return previews[p] || p; }
function thumbOf(w) { return w.image ? esc(src(w.image)) : esc(placeholder(hueOf(w))); }
function hueOf(w) { var h = 0, s = w.id || w.title || ''; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function placeholder(hue) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + hue + ',45%,30%)"/><stop offset="1" stop-color="hsl(' + ((hue + 50) % 360) + ',55%,8%)"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#g)"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function allTags(works) { var seen = []; works.forEach(function (w) { (w.tags || []).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); }); return seen; }

function showMain() { view = 'main'; renderAdmin(); }

function renderAdmin() {
  if (editing !== null) { root.innerHTML = editorHTML(); return; }
  var s = draft.site;
  var rows = draft.works.map(function (w, i) {
    return '<li class="wrow"><img src="' + thumbOf(w) + '" alt=""><div><div class="t">' + esc(w.title) + '</div><div class="m">' + esc((w.tags || []).join('、')) + (w.year ? '　' + esc(w.year) : '') + '</div></div><div class="ops">' +
      '<button class="btn small" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="上へ">↑</button>' +
      '<button class="btn small" data-act="down" data-i="' + i + '"' + (i === draft.works.length - 1 ? ' disabled' : '') + ' aria-label="下へ">↓</button>' +
      '<button class="btn small" data-act="edit" data-i="' + i + '">編集</button>' +
      '<button class="btn small danger" data-act="del" data-i="' + i + '">' + (delArmed === i ? '本当に削除する' : '削除') + '</button></div></li>';
  }).join('');
  root.innerHTML =
    '<div class="admin"><div class="admin-bar"><h1>管理画面</h1><div class="admin-actions">' +
    '<a class="btn" href="' + esc(siteUrl()) + '" target="_blank" rel="noopener">公開サイトを見る</a>' +
    '<button class="btn primary" data-act="save"' + (dirty && !saving ? '' : ' disabled') + '>保存して公開</button></div></div>' +
    '<p class="status' + (statusErr ? ' err' : '') + '" id="a-status" aria-live="polite">' + esc(status || (dirty ? '未公開の変更があります。' : '')) + '</p>' +
    '<section class="panel"><h2>サイトの基本情報</h2>' +
    '<label class="field"><span>名前（ページの大見出し）</span><input type="text" data-site="name" value="' + esc(s.name) + '"></label>' +
    '<label class="field"><span>紹介文</span><textarea data-site="lead">' + esc(s.lead) + '</textarea></label>' +
    '<label class="field"><span>連絡先メールアドレス</span><input type="email" data-site="email" value="' + esc(s.email) + '"></label></section>' +
    '<section class="panel"><div class="row"><h2>作品（' + draft.works.length + '件）</h2><button class="btn" data-act="add">作品を追加</button></div>' +
    (rows ? '<ul class="wlist">' + rows + '</ul>' : '<p class="status">まだ作品がありません。「作品を追加」から登録してください。</p>') + '</section>' +
    '<p class="hint">「保存して公開」を押すまで、変更は公開サイトに反映されません。押したあと、反映まで1〜2分かかることがあります。表示順は上から順です。</p>' +
    '<p class="hint"><button class="btn small" data-act="reload">最新を読み込み直す</button> <button class="btn small" data-act="logout">トークンを削除して終了</button></p></div>';
}

function blankWork() { return { id: 'w' + Date.now().toString(36), title: '', tags: [], year: new Date().getFullYear(), role: '', description: '', tools: [], video: null, image: '', links: [] }; }

function editorHTML() {
  var b = buf, v = b.video, kind = v ? v.type : 'none';
  var tagSet = allTags(draft.works);
  (b.tags || []).forEach(function (t) { if (tagSet.indexOf(t) < 0) tagSet.push(t); });
  var checks = tagSet.map(function (t) { return '<label><input type="checkbox" data-tag="' + esc(t) + '"' + ((b.tags || []).indexOf(t) >= 0 ? ' checked' : '') + '> ' + esc(t) + '</label>'; }).join('');
  var vref = '';
  if (kind === 'youtube') vref = v.id ? 'https://www.youtube.com/watch?v=' + v.id : (v.raw || '');
  if (kind === 'vimeo') vref = v.id ? 'https://vimeo.com/' + v.id : (v.raw || '');
  var linksText = (b.links || []).map(function (l) { return (l.label || '') + ' | ' + l.url; }).join('\n');
  return '<div class="admin"><div class="admin-bar"><h1>' + (editing === -1 ? '作品を追加' : '作品を編集') + '</h1><div class="admin-actions">' +
    '<button class="btn" data-act="cancel">キャンセル</button><button class="btn primary" data-act="apply"' + (busy ? ' disabled' : '') + '>この内容で確定</button></div></div>' +
    '<p class="status' + (formErr ? ' err' : '') + '" id="a-status" aria-live="polite">' + esc(formErr || busy || '確定すると一覧に戻ります。公開は一覧の「保存して公開」で行います。') + '</p>' +
    '<section class="panel">' +
    '<label class="field"><span>作品名（必須）</span><input type="text" id="f-title" value="' + esc(b.title) + '"></label>' +
    '<div class="two"><label class="field"><span>制作年</span><input type="number" id="f-year" value="' + esc(b.year) + '"></label>' +
    '<label class="field"><span>担当</span><input type="text" id="f-role" value="' + esc(b.role) + '" placeholder="例：監督・編集"></label></div>' +
    '<label class="field"><span>解説</span><textarea id="f-desc">' + esc(b.description) + '</textarea></label>' +
    '<div class="field"><span>カテゴリ（タグ）</span><div class="checks">' + (checks || '<small>まだタグがありません。下の欄から追加できます。</small>') + '</div></div>' +
    '<label class="field"><span>新しいタグを追加</span><input type="text" id="f-newtag" placeholder="例：写真（複数ならカンマ区切り）"></label>' +
    '<label class="field"><span>使用ツール</span><input type="text" id="f-tools" value="' + esc((b.tools || []).join(', ')) + '" placeholder="例：Premiere Pro, Blender, Python"><small>カンマで区切って入力します。</small></label></section>' +
    '<section class="panel"><h2>画像・動画</h2><div class="field"><span>サムネイル画像</span>' +
    (b.image ? '<img class="preview" src="' + esc(src(b.image)) + '" alt="">' : '<small>未設定のときは仮の色が表示されます。</small>') +
    '<input type="file" id="f-imgfile" accept="image/*" hidden><button class="btn small" type="button" data-act="pickimg">画像を選ぶ</button> ' +
    (b.image ? '<button class="btn small" type="button" data-act="rmimg">外す</button>' : '') + '<small>大きい画像は自動で縮小されます。横長（16:10くらい）がきれいに収まります。</small></div>' +
    '<label class="field"><span>動画</span><select id="f-vkind"><option value="none"' + (kind === 'none' ? ' selected' : '') + '>なし</option><option value="youtube"' + (kind === 'youtube' ? ' selected' : '') + '>YouTube</option><option value="vimeo"' + (kind === 'vimeo' ? ' selected' : '') + '>Vimeo</option><option value="file"' + (kind === 'file' ? ' selected' : '') + '>動画ファイル（25MBまで）</option></select></label>' +
    ((kind === 'youtube' || kind === 'vimeo') ? '<label class="field"><span>動画のURL</span><input type="text" id="f-vref" value="' + esc(vref) + '" placeholder="https://..."></label>' : '') +
    (kind === 'file' ? '<div class="field"><input type="file" id="f-vidfile" accept="video/mp4,video/webm" hidden><button class="btn small" type="button" data-act="pickvid">動画ファイルを選ぶ</button> <small>' + (v && v.src ? '選択済み：' + esc(v.src) + '（選び直すと差し替わります）' : 'mp4かwebm、25MBまで。大きい動画はYouTubeがおすすめです。') + '</small></div>' : '') +
    '</section><section class="panel"><label class="field"><span>リンク（任意）</span><textarea id="f-links" style="min-height:80px" placeholder="ラベル | URL（1行に1つ）&#10;例：GitHub | https://github.com/...">' + esc(linksText) + '</textarea></label></section></div>';
}

function parseYouTube(s) { if (!s) return ''; if (/^[\w-]{11}$/.test(s)) return s; var m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : ''; }
function parseVimeo(s) { if (!s) return ''; if (/^\d+$/.test(s)) return s; var m = s.match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? m[1] : ''; }

function readForm() {
  var g = function (id) { return document.getElementById(id); };
  if (!g('f-title')) return;
  buf.title = g('f-title').value.trim();
  buf.year = g('f-year').value.trim();
  buf.role = g('f-role').value.trim();
  buf.description = g('f-desc').value.trim();
  buf.tools = g('f-tools').value.split(/[,、，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  var tags = [];
  document.querySelectorAll('input[data-tag]').forEach(function (c) { if (c.checked) tags.push(c.dataset.tag); });
  g('f-newtag').value.split(/[,、，]/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); });
  g('f-newtag').value = '';
  buf.tags = tags;
  var kind = g('f-vkind').value;
  if (kind === 'none') buf.video = null;
  else if (kind === 'file') buf.video = (buf.video && buf.video.type === 'file') ? buf.video : { type: 'file', src: '' };
  else { var raw = g('f-vref') ? g('f-vref').value.trim() : ''; buf.video = { type: kind, id: kind === 'youtube' ? parseYouTube(raw) : parseVimeo(raw), raw: raw }; }
  var links = [];
  g('f-links').value.split('\n').forEach(function (line) {
    line = line.trim(); if (!line) return;
    var p = line.split('|'), url = (p.length > 1 ? p.slice(1).join('|') : p[0]).trim(), label = p.length > 1 ? p[0].trim() : '';
    links.push({ label: label, url: url });
  });
  buf.links = links;
}

async function prepImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return { blob: file, ext: (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png' };
  try {
    var bmp = await createImageBitmap(file);
    var sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    var c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    var blob = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.86); });
    if (blob) return { blob: blob, ext: 'jpg' };
  } catch (e) {}
  return { blob: file, ext: 'jpg' };
}

async function handleFile(input, isVideo) {
  var f = input.files && input.files[0]; if (!f) return;
  readForm(); formErr = '';
  if (isVideo && f.size > 25 * 1024 * 1024) { formErr = '動画ファイルが25MBを超えています。YouTubeに上げて、URLを貼る方法がおすすめです。'; renderAdmin(); return; }
  busy = '読み込んでいます…'; renderAdmin();
  try {
    var path, blob;
    if (isVideo) { blob = f; path = 'media/' + buf.id + '-' + Date.now().toString(36) + '.' + ((f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4'); }
    else { var p = await prepImage(f); blob = p.blob; path = 'img/' + buf.id + '-' + Date.now().toString(36) + '.' + p.ext; }
    pending[path] = blob; previews[path] = URL.createObjectURL(blob);
    if (isVideo) buf.video = { type: 'file', src: path }; else buf.image = path;
    busy = '';
  } catch (e) { busy = ''; formErr = '画像・動画を読み込めませんでした。別のファイルでお試しください。'; }
  renderAdmin();
}

function applyEdit() {
  readForm();
  if (!buf.title) { formErr = '作品名を入力してください。'; renderAdmin(); return; }
  var v = buf.video;
  if (v && (v.type === 'youtube' || v.type === 'vimeo') && !v.id) { formErr = '動画のURLを読み取れませんでした。ブラウザのアドレスバーのURLをそのまま貼ってください。'; renderAdmin(); return; }
  if (v && v.type === 'file' && !v.src) { formErr = '動画ファイルを選んでください。使わない場合は「なし」に戻してください。'; renderAdmin(); return; }
  if (buf.links.some(function (l) { return !safeUrl(l.url); })) { formErr = 'リンクは http:// または https:// で始まるURLを入力してください。'; renderAdmin(); return; }
  if (v && v.raw !== undefined) delete v.raw;
  buf.year = buf.year ? (parseInt(buf.year, 10) || buf.year) : '';
  if (editing === -1) draft.works.unshift(buf); else draft.works[editing] = buf;
  dirty = true; editing = null; buf = null; formErr = ''; status = ''; renderAdmin(); window.scrollTo(0, 0);
}

async function save() {
  if (saving) return;
  saving = true; var sb = $('[data-act="save"]'); if (sb) sb.disabled = true;
  setStatus('公開しています…');
  try {
    var used = {};
    draft.works.forEach(function (w) { if (w.image) used[w.image] = 1; if (w.video && w.video.src) used[w.video.src] = 1; });
    var paths = Object.keys(pending).filter(function (p) { return used[p]; });
    for (var i = 0; i < paths.length; i++) {
      setStatus('ファイルをアップロードしています（' + (i + 1) + '/' + paths.length + '）…');
      await putFile(paths[i], await blobToB64(pending[paths[i]]), 'Add ' + paths[i]);
      delete pending[paths[i]];
    }
    setStatus('作品データを保存しています…');
    var body = { message: 'Update works.json', content: toB64(JSON.stringify(draft, null, 2) + '\n'), branch: cfg.branch };
    if (remote.sha) body.sha = remote.sha;
    var res = await gh('PUT', '/contents/works.json', body);
    remote.sha = res.content.sha; dirty = false; saving = false;
    status = '保存しました。公開サイトへの反映まで、1〜2分かかることがあります。'; statusErr = false;
    renderAdmin();
  } catch (e) {
    saving = false;
    status = errText(e); statusErr = true; renderAdmin();
  }
}

async function reload() {
  if (dirty && !window.confirm('未保存の変更は消えます。読み込み直しますか？')) return;
  setStatus('読み込んでいます…');
  try { await loadRemote(); pending = {}; status = '最新の状態を読み込みました。'; statusErr = false; renderAdmin(); }
  catch (e) { status = errText(e); statusErr = true; renderAdmin(); }
}

/* ---------- イベント ---------- */
root.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, i = parseInt(b.dataset.i, 10);
  if (act === 'connect') connect();
  else if (act === 'logout') logout();
  else if (act === 'reload') reload();
  else if (act === 'add') { editing = -1; buf = blankWork(); formErr = ''; renderAdmin(); window.scrollTo(0, 0); }
  else if (act === 'edit') { editing = i; buf = clone(draft.works[i]); formErr = ''; renderAdmin(); window.scrollTo(0, 0); }
  else if (act === 'cancel') { editing = null; buf = null; formErr = ''; busy = ''; renderAdmin(); }
  else if (act === 'apply') applyEdit();
  else if (act === 'up' && i > 0) { var t = draft.works[i]; draft.works[i] = draft.works[i - 1]; draft.works[i - 1] = t; dirty = true; delArmed = -1; renderAdmin(); }
  else if (act === 'down' && i < draft.works.length - 1) { var u = draft.works[i]; draft.works[i] = draft.works[i + 1]; draft.works[i + 1] = u; dirty = true; delArmed = -1; renderAdmin(); }
  else if (act === 'del') { if (delArmed === i) { draft.works.splice(i, 1); delArmed = -1; dirty = true; } else delArmed = i; renderAdmin(); }
  else if (act === 'save') save();
  else if (act === 'pickimg') $('#f-imgfile').click();
  else if (act === 'pickvid') $('#f-vidfile').click();
  else if (act === 'rmimg') { readForm(); buf.image = ''; renderAdmin(); }
});
root.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.site;
  if (k && draft) { draft.site[k] = e.target.value; dirty = true; var sb = $('[data-act="save"]'); if (sb) sb.disabled = false; setStatus('未公開の変更があります。'); }
});
root.addEventListener('change', function (e) {
  if (view !== 'main') return;
  if (e.target.id === 'f-vkind') { readForm(); renderAdmin(); }
  else if (e.target.id === 'f-imgfile') handleFile(e.target, false);
  else if (e.target.id === 'f-vidfile') handleFile(e.target, true);
});
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 起動 ---------- */
loadCfg();
if (cfg.owner && cfg.repo && cfg.token) {
  view = 'loading'; root.innerHTML = '<div class="admin"><p class="status">GitHubから読み込んでいます…</p></div>';
  loadRemote().then(showMain).catch(function (e) { showSetup(errText(e)); });
} else showSetup();
})();

</script>
</body>
