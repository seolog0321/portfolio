<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="映像・グラフィック・3D・プロジェクトの実績ギャラリー">
<title>Portfolio</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #000;
  --surface: #161616;
  --surface-2: #222;
  --line: #2b2b2b;
  --text: #f2f2f2;
  --muted: #8f8f8f;
  --danger: #ff6b6b;
  --radius: 6px;
  --gap: clamp(12px, 2vw, 24px);
  --pad: clamp(16px, 4vw, 48px);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic",
          "Noto Sans JP", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
html.scroll-lock { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.7; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); z-index: 10; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- Gallery ---------- */
.site-header { padding: clamp(40px, 9vw, 112px) var(--pad) clamp(24px, 4vw, 48px); max-width: 1600px; margin: 0 auto; }
.site-title { margin: 0; font-size: clamp(2rem, 7vw, 5.5rem); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.site-lead { margin: 1.2em 0 0; max-width: 38em; color: var(--muted); font-size: clamp(.9rem, 1.6vw, 1.05rem); white-space: pre-line; }

.filter-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.filter-inner { max-width: 1600px; margin: 0 auto; padding: 12px var(--pad); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-inner::-webkit-scrollbar { display: none; }
.chip { flex: none; appearance: none; cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: .875rem; color: var(--muted); transition: color .2s, border-color .2s, background .2s; }
.chip:hover { color: var(--text); border-color: #555; }
.chip[aria-pressed="true"] { background: var(--text); color: #000; border-color: var(--text); }
.chip .count { margin-left: .45em; opacity: .6; font-variant-numeric: tabular-nums; }

main { max-width: 1600px; margin: 0 auto; padding: var(--gap) var(--pad) 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: calc(var(--gap) * 1.4) var(--gap); margin: 0; padding: 0; list-style: none; }
.card { margin: 0; }
.card[hidden] { display: none; }
.card-btn { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--radius); background: var(--surface); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.play-badge { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; }
.play-badge::before { content: ""; margin-left: 2px; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.card-title { margin: 12px 0 0; font-size: 1rem; font-weight: 500; line-height: 1.4; }
.card-meta { margin: 2px 0 0; font-size: .8125rem; color: var(--muted); }
@media (hover: hover) {
  .card-btn:hover .thumb img { transform: scale(1.04); }
  .grid:hover .card { opacity: .42; transition: opacity .3s; }
  .grid:hover .card:hover, .grid:hover .card:focus-within { opacity: 1; }
}
.empty { color: var(--muted); padding: 64px 0; text-align: center; }

.site-footer { max-width: 1600px; margin: 0 auto; padding: 32px var(--pad) 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
.site-footer a { text-decoration: none; border-bottom: 1px solid var(--line); }
.site-footer a:hover { color: var(--text); }

.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--text); color: #000; text-decoration: none; font-size: .875rem; padding: 8px 18px; border-radius: 999px; }

/* ---------- Modal ---------- */
dialog.modal { width: min(1040px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); overflow: hidden; }
dialog.modal::backdrop { background: rgba(0,0,0,.82); }
dialog.modal[open] { animation: modal-in .28s cubic-bezier(.2,.7,.2,1); }
@keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-scroll { max-height: calc(100dvh - 34px); overflow-y: auto; overscroll-behavior: contain; }
.modal-media { background: #000; aspect-ratio: 16 / 9; }
.modal-media iframe, .modal-media video, .modal-media img { width: 100%; height: 100%; display: block; border: 0; object-fit: contain; background: #000; }
.media-placeholder { position: relative; width: 100%; height: 100%; }
.media-placeholder img { object-fit: cover; }
.ext-link { padding: 10px clamp(20px,4vw,36px) 0; font-size: .875rem; color: var(--muted); }
.modal-body { padding: clamp(20px,4vw,36px); display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 28px clamp(24px,5vw,64px); }
.modal-title { margin: 0; font-size: clamp(1.35rem,3vw,2rem); line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
.modal-desc { margin: 14px 0 0; color: #cfcfcf; max-width: 38em; white-space: pre-line; }
.modal-side h3 { margin: 0 0 8px; font-size: .8125rem; font-weight: 500; color: var(--muted); }
.modal-side section + section { margin-top: 22px; }
.modal-side dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: .9rem; }
.modal-side dt { color: var(--muted); }
.modal-side dd { margin: 0; }
.tool-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tool-list li { padding: 3px 12px; border: 1px solid #3a3a3a; border-radius: 999px; font-size: .8125rem; }
.link-list { margin: 0; padding: 0; list-style: none; font-size: .9rem; }
.link-list a { text-decoration: none; border-bottom: 1px solid #555; }
.link-list a:hover { border-color: var(--text); }
.modal-nav { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(20px,4vw,36px); border-top: 1px solid var(--line); }
.nav-btn { appearance: none; cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: .875rem; color: var(--muted); transition: color .2s, border-color .2s; }
.nav-btn:hover { color: var(--text); border-color: #555; }
.nav-btn[disabled] { opacity: .3; cursor: default; }
.close-btn { position: absolute; top: 12px; right: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.close-btn::before, .close-btn::after { content: ""; position: absolute; left: 12px; top: 19px; width: 16px; height: 1.5px; background: #fff; }
.close-btn::before { transform: rotate(45deg); }
.close-btn::after { transform: rotate(-45deg); }

/* ---------- Admin ---------- */
.admin { max-width: 960px; margin: 0 auto; padding: 32px var(--pad) 96px; }
.admin h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
.admin h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.admin-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; cursor: pointer; display: inline-block; text-decoration: none; background: transparent; border: 1px solid #444; border-radius: 999px; padding: 8px 18px; font-size: .9rem; color: var(--text); }
.btn:hover { border-color: #888; }
.btn.primary { background: var(--text); color: #000; border-color: var(--text); }
.btn.danger { color: var(--danger); border-color: #5a2a2a; }
.btn.small { padding: 4px 12px; font-size: .8125rem; }
.btn[disabled] { opacity: .35; cursor: default; }
.status { min-height: 1.7em; margin: 12px 0 0; color: var(--muted); font-size: .9rem; }
.status.err { color: var(--danger); }
.banner { margin: 16px 0 0; padding: 12px 16px; border: 1px solid #444; border-radius: var(--radius); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: .9rem; }
.panel { margin-top: 28px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: .8125rem; color: var(--muted); margin-bottom: 4px; }
.field small { display: block; color: var(--muted); font-size: .75rem; margin-top: 4px; }
.field input[type="text"], .field input[type="email"], .field input[type="number"], .field textarea, .field select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); font-size: 16px; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: .875rem; cursor: pointer; }
.wlist { list-style: none; margin: 0; padding: 0; }
.wrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow img { width: 96px; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; display: block; background: var(--bg); }
.wrow .t { font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.wrow .m { font-size: .8125rem; color: var(--muted); }
.wrow .ops { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.preview { width: 240px; max-width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: var(--radius); display: block; margin: 6px 0 8px; background: var(--bg); }
.hint { color: var(--muted); font-size: .8125rem; margin-top: 24px; }

@media (max-width: 720px) {
  dialog.modal { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
  .modal-scroll { max-height: 100dvh; height: 100dvh; }
  .modal-body { grid-template-columns: 1fr; }
  .chip { padding: 8px 16px; }
  .two { grid-template-columns: 1fr; }
  .wrow { grid-template-columns: 72px 1fr; }
  .wrow img { width: 72px; }
  .wrow .ops { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"><p style="padding:48px;color:#8f8f8f">読み込み中…</p></div>
<noscript><p style="padding:48px">このページの表示にはJavaScriptが必要です。</p></noscript>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var safeUrl = function (u) { return /^https?:\/\//i.test(u || '') ? u : ''; };
var root = $('#root');
var state = null, currentTag = null, activeId = null;

function allTags(works) {
  var seen = [];
  works.forEach(function (w) { (w.tags || []).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); });
  return seen;
}
function hueOf(w) { var h = 0, s = w.id || w.title || ''; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function placeholder(hue) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + hue + ',45%,30%)"/><stop offset="1" stop-color="hsl(' + ((hue + 50) % 360) + ',55%,8%)"/></linearGradient><radialGradient id="r" cx=".72" cy=".3" r=".5"><stop offset="0" stop-color="hsl(' + ((hue + 20) % 360) + ',70%,65%)" stop-opacity=".45"/><stop offset="1" stop-color="transparent"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#g)"/><rect width="1600" height="1000" fill="url(#r)"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function imgOf(w) { return w.image || placeholder(hueOf(w)); }

function build() {
  var s = state.site || {};
  document.title = (s.name || 'Portfolio') + ' — Portfolio';
  root.innerHTML =
    '<header class="site-header"><h1 class="site-title">' + esc(s.name) + '</h1>' +
    (s.lead ? '<p class="site-lead">' + esc(s.lead) + '</p>' : '') + '</header>' +
    '<nav class="filter-bar" aria-label="作品の絞り込み"><div class="filter-inner" id="filters"></div></nav>' +
    '<main><ul class="grid" id="grid"></ul><p class="empty" id="empty" hidden></p></main>' +
    '<footer class="site-footer"><span>© ' + new Date().getFullYear() + ' ' + esc(s.name) + '</span>' +
    (s.email ? '<span><a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a></span>' : '') + '</footer>' +
    '<dialog class="modal" id="modal" aria-labelledby="modal-title"><button class="close-btn" id="modal-close" aria-label="閉じる"></button>' +
    '<div class="modal-scroll" id="modal-scroll"><div class="modal-media" id="modal-media"></div><div id="modal-ext"></div>' +
    '<div class="modal-body"><div><h2 class="modal-title" id="modal-title"></h2><p class="modal-desc" id="modal-desc"></p></div>' +
    '<aside class="modal-side"><section><h3>概要</h3><dl id="modal-info"></dl></section>' +
    '<section id="tools-wrap"><h3>使用ツール</h3><ul class="tool-list" id="modal-tools"></ul></section>' +
    '<section id="links-wrap"><h3>リンク</h3><ul class="link-list" id="modal-links"></ul></section></aside></div>' +
    '<div class="modal-nav"><button class="nav-btn" id="nav-prev">前の作品</button><button class="nav-btn" id="nav-next">次の作品</button></div></div></dialog>';
  renderFilters(); renderGrid(); applyFilter(); bindModal();
}
function renderFilters() {
  var tags = allTags(state.works), el = $('#filters');
  if (!tags.length) { el.parentNode.hidden = true; return; }
  var html = '<button class="chip" type="button" data-tag="" aria-pressed="true">すべて<span class="count">' + state.works.length + '</span></button>';
  tags.forEach(function (t) {
    var n = state.works.filter(function (w) { return (w.tags || []).indexOf(t) >= 0; }).length;
    html += '<button class="chip" type="button" data-tag="' + esc(t) + '" aria-pressed="false">' + esc(t) + '<span class="count">' + n + '</span></button>';
  });
  el.innerHTML = html;
  el.onclick = function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    currentTag = b.dataset.tag === '' ? null : b.dataset.tag;
    el.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', (c.dataset.tag === '' ? null : c.dataset.tag) === currentTag); });
    applyFilter();
  };
}
function visibleWorks() { return state.works.filter(function (w) { return currentTag === null || (w.tags || []).indexOf(currentTag) >= 0; }); }
function renderGrid() {
  $('#grid').innerHTML = state.works.map(function (w) {
    return '<li class="card" data-id="' + esc(w.id) + '"><button class="card-btn" type="button" aria-haspopup="dialog"><div class="thumb"><img src="' + esc(imgOf(w)) + '" alt="" loading="lazy">' +
      (w.video ? '<span class="play-badge" aria-hidden="true"></span>' : '') + '</div><h2 class="card-title">' + esc(w.title) + '</h2><p class="card-meta">' +
      esc((w.tags || []).join('、')) + (w.year ? '　' + esc(w.year) : '') + '</p></button></li>';
  }).join('');
  $('#grid').onclick = function (e) { var li = e.target.closest('.card'); if (li) openModal(li.dataset.id); };
}
function applyFilter() {
  var ids = visibleWorks().map(function (w) { return w.id; }), shown = 0;
  document.querySelectorAll('.card').forEach(function (li) { var v = ids.indexOf(li.dataset.id) >= 0; li.hidden = !v; if (v) shown++; });
  var em = $('#empty'); em.hidden = shown > 0;
  em.textContent = state.works.length ? 'このカテゴリの作品はまだありません。' : 'まだ作品がありません。';
}
function mediaHTML(w) {
  var v = w.video;
  if (v && v.type === 'youtube' && v.id) return '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '" title="' + esc(w.title) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>';
  if (v && v.type === 'vimeo' && v.id) return '<iframe src="https://player.vimeo.com/video/' + encodeURIComponent(v.id) + '" title="' + esc(w.title) + '" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
  if (v && v.type === 'file' && v.src) return '<video src="' + esc(v.src) + '" controls playsinline preload="metadata"' + (w.image ? ' poster="' + esc(w.image) + '"' : '') + '></video>';
  return '<div class="media-placeholder"><img src="' + esc(imgOf(w)) + '" alt="' + esc(w.title) + '"></div>';
}
function openModal(id) {
  var w = state.works.filter(function (x) { return x.id === id; })[0]; if (!w) return;
  var modal = $('#modal'); activeId = id;
  $('#modal-media').innerHTML = mediaHTML(w);
  $('#modal-ext').innerHTML = '';
  $('#modal-title').textContent = w.title;
  $('#modal-desc').textContent = w.description || '';
  $('#modal-info').innerHTML = '<dt>カテゴリ</dt><dd>' + esc((w.tags || []).join('、') || '—') + '</dd>' +
    (w.year ? '<dt>制作年</dt><dd>' + esc(w.year) + '</dd>' : '') + (w.role ? '<dt>担当</dt><dd>' + esc(w.role) + '</dd>' : '');
  var tools = w.tools || [];
  $('#tools-wrap').hidden = !tools.length;
  $('#modal-tools').innerHTML = tools.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
  var links = (w.links || []).filter(function (l) { return safeUrl(l.url); });
  $('#links-wrap').hidden = !links.length;
  $('#modal-links').innerHTML = links.map(function (l) { return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label || l.url) + '</a></li>'; }).join('');
  var list = visibleWorks(), i = list.findIndex(function (x) { return x.id === id; });
  $('#nav-prev').disabled = i <= 0;
  $('#nav-next').disabled = i === -1 || i >= list.length - 1;
  if (!modal.open) { modal.showModal(); document.documentElement.classList.add('scroll-lock'); }
  $('#modal-scroll').scrollTop = 0;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function step(dir) {
  var list = visibleWorks(), i = list.findIndex(function (x) { return x.id === activeId; });
  if (list[i + dir]) openModal(list[i + dir].id);
}
function bindModal() {
  var modal = $('#modal');
  modal.addEventListener('close', function () {
    $('#modal-media').innerHTML = '';
    document.documentElement.classList.remove('scroll-lock');
    activeId = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  });
  $('#modal-close').onclick = function () { modal.close(); };
  $('#nav-prev').onclick = function () { step(-1); };
  $('#nav-next').onclick = function () { step(1); };
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });
}
document.addEventListener('keydown', function (e) {
  var m = $('#modal'); if (!m || !m.open) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
window.addEventListener('hashchange', function () {
  if (!state) return;
  var h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var m = $('#modal');
  if (h && state.works.some(function (w) { return w.id === h; })) openModal(h);
  else if (m && m.open) m.close();
});

function fail(msg) { root.innerHTML = '<div class="site-header"><p class="site-lead">' + esc(msg) + '</p></div>'; }

fetch('works.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
  .then(function (d) {
    state = d; if (!state.site) state.site = {}; if (!Array.isArray(state.works)) state.works = [];
    build();
    var h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (h && state.works.some(function (w) { return w.id === h; })) openModal(h);
  })
  .catch(function () {
    fail('作品データを読み込めませんでした。ファイルを直接開いている場合は、公開したURLか、ローカルサーバー（VS Codeの Live Server など）で開いてください。');
  });
})();

</script>
</body>
</html>
